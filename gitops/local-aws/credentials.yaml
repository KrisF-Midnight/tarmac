# The emulator's credentials.
#
# These are in git on purpose, and the reasoning matters more than the values:
# they are not secret. LocalStack accepts any credentials and validates none of
# them, so `localstack`/`localstack` is a placeholder that satisfies the SDK's
# signing code and grants access to nothing. Committing them is what keeps a
# developer's real ~/.aws/credentials out of the path entirely — a mistake in
# this stack cannot reach an account that charges money.
#
# What a real environment does instead is deliberately NOT modelled here. It
# would deliver this Secret from outside git — External Secrets, sealed-secrets,
# or a cloud secret store — or dispense with it entirely in favour of the
# workload's own identity. Both are out of scope for a local emulator, and
# pretending otherwise would mean a Secret in git that IS a secret.
#
# One real limitation worth recording, because it constrains that future: the
# application's S3 client has no AssumeRoleWithWebIdentity support, so a
# projected service-account token — the IRSA / EKS Pod Identity path — would not
# authenticate it as-is. Moving to a real account means changing how the
# application gets credentials, not only where this Secret comes from.
#
# It lives in this directory rather than beside the application because it is a
# property of the environment, not of the workload. The deployment names the keys
# it needs; where they come from is the environment's business.
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: greeter
  labels:
    app.kubernetes.io/name: aws
    app.kubernetes.io/component: object-store
    app.kubernetes.io/part-of: tarmac-local
type: Opaque
stringData:
  # Read by the S3 client under exactly these names. The application does not
  # name them in its own source, so a typo here surfaces only as a failed
  # readiness probe with the reason on stderr — never as a startup error.
  AWS_ACCESS_KEY_ID: localstack
  AWS_SECRET_ACCESS_KEY: localstack
  AWS_REGION: eu-west-1
